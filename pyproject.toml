[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mowftee"
version = "0.0.0"
description = "Local-first Vietnamese AI companion for CachyOS/Linux"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mowftee"]
