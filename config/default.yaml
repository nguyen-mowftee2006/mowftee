config_schema_version: 1

app:
  name: mowftee
  environment: development

paths:
  model_dir: /srv/mowftee/models/ollama

logging:
  level: INFO
  console: true
  file: true
  max_bytes: 5242880
  backup_count: 3

privacy:
  log_prompts: false
  log_conversations: false
  log_file_contents: false
  log_audio_metadata: false

llm:
  provider: ollama
  model: qwen3:4b-instruct
  base_url: http://127.0.0.1:11434
  timeout: 30.0
  health_timeout: 2.0

conversation:
  default_system_prompt: "Bạn là Mowftee, một bạn đồng hành AI bằng tiếng Việt. Hãy phản hồi tự nhiên, ngắn gọn, thân thiện và xưng hô hợp lý. Tránh trả lời bằng các câu mẫu trợ lý doanh nghiệp rập khuôn."
  max_turns: 20
  inject_datetime: true
